<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Image to PDF - Eleven Tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>body{background:#0f172a;color:white;font-family:system-ui;text-align:center;padding:20px} .box{background:#1e293b;padding:20px;border-radius:15px;max-width:400px;margin:auto} button{background:#38bdf8;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;margin-top:15px;width:100%} input{margin-top:15px}</style></head>
<body>
<div class="box">
<h2>🖼️ Image to PDF</h2>
<p>Apni tasveer ko PDF banao - 100% Free</p>
<input type="file" id="img" accept="image/*">
<button onclick="makePDF()">Convert to PDF & Download</button>
<a href="index.html"><p style="color:#94a3b8;margin-top:15px">← Back to Tools</p></a>
</div>
<script>
async function makePDF(){
const file=document.getElementById('img').files[0];
if(!file)return alert('Pehle Image Select Karo!');
const reader=new FileReader();
reader.onload=function(e){
const {jsPDF}=window.jspdf;
const doc=new jsPDF();
const img=new Image();
img.src=e.target.result;
img.onload=()=>{doc.addImage(img,'JPEG',10,10,190,0);doc.save('ElevenTools-'+Date.now()+'.pdf');alert('PDF Download Ho Gaya!');}
};reader.readAsDataURL(file);
}
</script>
</body></html>
