<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Word Counter</title><style>body{background:#0f172a;color:white;font-family:system-ui;text-align:center;padding:20px}.box{background:#1e293b;padding:20px;border-radius:15px;max-width:400px;margin:auto}textarea{width:90%;height:120px;border-radius:10px;padding:10px}</style></head><body><div class="box"><h2>📝 Word Counter</h2><textarea id="text" oninput="count()" placeholder="Yahan Likho..."></textarea><h3 id="c">Words: 0 | Chars: 0</h3><a href="index.html" style="color:#94a3b8"><p>← Back</p></a></div><script>function count(){let t=document.getElementById('text').value;document.getElementById('c').innerText=`Words: ${t.split(/\s+/).filter(w=>w!='').length} | Chars: ${t.length}`}</script></body></html>
