<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>YT Thumbnail</title><style>body{background:#0f172a;color:white;font-family:system-ui;text-align:center;padding:20px}.box{background:#1e293b;padding:20px;border-radius:15px;max-width:400px;margin:auto}input{width:90%;padding:12px;border-radius:10px;border:none}button{background:#ef4444;color:white;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:15px}img{width:100%;margin-top:15px;border-radius:10px}</style></head><body><div class="box"><h2>🔥 YT Thumbnail Downloader</h2><input id="link" placeholder="YouTube Link Paste Karo"><button onclick="get()">Get Thumbnail</button><div id="res"></div><a href="index.html" style="color:#94a3b8"><p>← Back</p></a></div><script>function get(){let url=document.getElementById('link').value;let id=url.split('v=')[1]?.split('&')[0] || url.split('youtu.be/')[1]?.split('?')[0];document.getElementById('res').innerHTML=`<img src='https://img.youtube.com/vi/${id}/maxresdefault.jpg'><a href='https://img.youtube.com/vi/${id}/maxresdefault.jpg' download><button style='background:#22c55e'>Download HD</button></a>`}</script></body></html>
