<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>QR Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{background:#0f172a;color:white;font-family:system-ui;text-align:center;padding:20px}.box{background:#1e293b;padding:20px;border-radius:15px;max-width:400px;margin:auto}input{width:90%;padding:12px;border-radius:10px;border:none;margin-top:15px}button{background:#38bdf8;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:15px}#qrcode{display:flex;justify-content:center;margin-top:20px;background:white;padding:10px;border-radius:10px}</style></head><body><div class="box"><h2>📱 QR Generator</h2><input id="text" placeholder="Yahan Link ya Number Likho"><button onclick="gen()">Generate QR</button><div id="qrcode"></div><a href="index.html" style="color:#94a3b8"><p>← Back</p></a></div><script>function gen(){document.getElementById('qrcode').innerHTML="";new QRCode(document.getElementById("qrcode"),document.getElementById("text").value);}</script></body></html>
