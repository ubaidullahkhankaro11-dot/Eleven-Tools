<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Password Generator</title>
<style>body{background:#0f172a;color:white;font-family:system-ui;text-align:center;padding:20px}.box{background:#1e293b;padding:25px;border-radius:15px;max-width:400px;margin:auto}button{background:#38bdf8;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:15px;font-size:16px}input{width:90%;padding:12px;border-radius:10px;border:none;margin-top:15px;text-align:center;font-size:18px;font-weight:bold}</style></head><body><div class="box"><h2>🔑 Strong Password Generator</h2><input id="pass" readonly placeholder="Password"><button onclick="generate()">Generate Strong Password</button><button onclick="navigator.clipboard.writeText(document.getElementById('pass').value);alert('Copy Ho Gaya!')" style="background:#22c55e">Copy Password</button><a href="index.html" style="color:#94a3b8"><p>← Back to Tools</p></a></div><script>function generate(){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";let p="";for(let i=0;i<16;i++)p+=chars.charAt(Math.floor(Math.random()*chars.length));document.getElementById('pass').value=p;}</script></body></html>
