<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Age Calculator</title><style>body{background:#0f172a;color:white;font-family:system-ui;text-align:center;padding:20px}.box{background:#1e293b;padding:20px;border-radius:15px;max-width:400px;margin:auto}input{width:90%;padding:12px;border-radius:10px;border:none;margin-top:10px}button{background:#38bdf8;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:15px}</style></head><body><div class="box"><h2>🎂 Age Calculator</h2><input type="date" id="dob"><button onclick="calc()">Calculate Age</button><h3 id="result"></h3><a href="index.html" style="color:#94a3b8"><p>← Back</p></a></div><script>function calc(){let dob=new Date(document.getElementById('dob').value);let diff=Date.now()-dob.getTime();let age=new Date(diff);document.getElementById('result').innerHTML=Math.abs(age.getUTCFullYear()-1970)+" Years Old";}</script></body></html>
